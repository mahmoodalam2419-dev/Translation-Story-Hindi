<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Translation Story Hindi</title>
<meta name="description" content="Learn English through bilingual Hindi stories." />
<meta name="theme-color" content="#38BDF8" />
<style>
/* ===== Tokens ===== */
:root {
  --primary: #38BDF8;
  --primary-dark: #0EA5E9;
  --primary-tint: #E8F7FF;
  --secondary: #FFC107;
  --secondary-tint: #FFF6DC;
  --ink: #1A1E2B;
  --muted: #667085;
  --line: #E6E9F0;
  --bg: #FFFFFF;
  --card: #F7F9FC;
  --success: #16A34A;
  --success-tint: #EAFBEF;
  --danger: #DC3545;
  --danger-tint: #FDECEE;
  --on-secondary-tint: #8A6D00;
  --on-success-tint: #14532D;
  --on-danger-tint: #7A1E27;
  --chip-bg: #FFFFFF;
  --lesson-border: #F0DFA0;
  --overlay: rgba(20, 22, 30, .45);
  --radius: 14px;
  --radius-sm: 10px;
  --main-pad-x: 18px;
  --font-en: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-hi: 'Noto Sans Devanagari', 'Poppins', 'Segoe UI', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== Accent color themes ===== */
[data-accent="orange"] { --primary: #FB923C; --primary-dark: #EA7C1E; --primary-tint: #FFF1E6; }
[data-accent="green"]  { --primary: #22B573; --primary-dark: #1B9760; --primary-tint: #E7F9F0; }
[data-accent="yellow"] { --primary: #FBBF24; --primary-dark: #F59E0B; --primary-tint: #FFFBEB; }

/* ===== Dark mode ===== */
[data-mode="dark"] {
  --ink: #F1F3F9;
  --muted: #98A2B3;
  --line: #2A2E3C;
  --bg: #12141C;
  --card: #1B1E29;
  --success-tint: #123424;
  --danger-tint: #3A1620;
  --secondary-tint: #3A2E10;
  --on-secondary-tint: #F5D67A;
  --on-success-tint: #7FE3AA;
  --on-danger-tint: #F4A9B3;
  --chip-bg: #232734;
  --lesson-border: #4A3B12;
  --overlay: rgba(0, 0, 0, .6);
}
[data-mode="dark"][data-accent="default"], [data-mode="dark"]:not([data-accent]) { --primary-tint: #0F2A38; }
[data-mode="dark"][data-accent="orange"]  { --primary-tint: #3A2412; }
[data-mode="dark"][data-accent="green"]   { --primary-tint: #0F2E22; }
[data-mode="dark"][data-accent="yellow"]  { --primary-tint: #3A2C08; }

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-en);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body { font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-en); font-weight: 600; margin: 0; }
.hi { font-family: var(--font-hi); font-size: 1.06em; line-height: 1.85; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

/* ===== App shell ===== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .back-btn {
  border: none;
  background: var(--primary-tint);
  color: var(--primary);
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.topbar h1 { font-size: 17px; }
.topbar .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.topbar .settings-btn {
  margin-left: auto;
  border: none;
  background: var(--card);
  color: var(--muted);
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

/* ===== Home action buttons ===== */
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.action-card {
  position: relative;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
}
.action-card .icon { font-size: 18px; margin-bottom: 5px; display: block; }
.action-card .title { font-size: 13.5px; font-weight: 600; }
.action-card .desc { font-size: 11px; margin-top: 2px; opacity: .8; }
.action-card.learn { background: var(--primary-tint); color: var(--primary-dark); }
.action-card.games { background: var(--secondary-tint); color: var(--on-secondary-tint); }
.action-card .score-badge {
  position: absolute; top: 10px; right: 10px;
  display: flex; align-items: center; gap: 3px;
  background: rgba(255,255,255,.55); border-radius: 100px;
  padding: 3px 8px; font-size: 11px; font-weight: 700;
}

/* ===== Settings sheet ===== */
.settings-backdrop {
  position: fixed; inset: 0;
  background: var(--overlay);
  z-index: 90;
}
.settings-sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  padding: 18px 20px calc(24px + var(--safe-bottom));
  z-index: 91;
  box-shadow: 0 -8px 30px rgba(0,0,0,.15);
}
.settings-sheet .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.settings-sheet .head h3 { font-size: 16px; }
.settings-sheet .close-x {
  border: none; background: var(--card); color: var(--muted);
  width: 28px; height: 28px; border-radius: 8px; font-size: 15px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.settings-row:first-of-type { border-top: none; }
.settings-row .label { font-size: 14px; font-weight: 500; }
.settings-row .label .d { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.toggle-switch { position: relative; width: 46px; height: 27px; border-radius: 100px; border: none; background: var(--line); cursor: pointer; flex-shrink: 0; }
.toggle-switch.on { background: var(--primary); }
.toggle-switch .knob { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: left .15s ease; }
.toggle-switch.on .knob { left: 22px; }
.swatch-row { display: flex; gap: 12px; padding: 6px 0 4px; }
.swatch {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff;
  flex-shrink: 0;
}
.swatch.active { border-color: var(--ink); }
.swatch.c-default { background: #38BDF8; }
.swatch.c-orange { background: #FB923C; }
.swatch.c-green { background: #22B573; }
.swatch.c-yellow { background: #FBBF24; }

/* ===== Coming soon ===== */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.chip-row .chip { background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 100px; font-size: 12px; color: var(--muted); }

/* ===== Games hub ===== */
.game-tile-list { display: flex; flex-direction: column; gap: 10px; }
.game-tile {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; cursor: pointer;
}
.game-tile.locked { opacity: .5; cursor: default; }
.gt-icon { font-size: 24px; width: 40px; text-align: center; flex-shrink: 0; }
.gt-body { flex: 1; min-width: 0; }
.gt-title { font-size: 14.5px; font-weight: 600; }
.gt-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.gt-lock { font-size: 16px; color: var(--muted); flex-shrink: 0; }
.gt-best { font-size: 11.5px; font-weight: 600; color: var(--primary); background: var(--primary-tint); padding: 5px 9px; border-radius: 100px; flex-shrink: 0; white-space: nowrap; }
.game-tile.bonus-locked { border-color: var(--secondary); }
.gt-bonus-cta { flex-shrink: 0; }
.gt-lock-label {
  font-size: 11.5px; font-weight: 600; color: var(--on-secondary-tint, #8A5A00);
  background: var(--secondary-tint); padding: 6px 10px; border-radius: 100px;
  white-space: nowrap; display: inline-block;
}
.game-tile.bonus-locked.ad-loading { opacity: .7; cursor: default; }
.game-tile.bonus-locked.ad-loading .gt-lock-label { animation: speakPulse 0.9s ease-in-out infinite; }

/* ===== Game HUD / quiz ===== */
.game-hud { margin-bottom: 14px; }
.hud-progress-track { height: 6px; background: var(--line); border-radius: 100px; overflow: hidden; margin-bottom: 10px; }
.hud-progress-fill { height: 100%; background: var(--primary); border-radius: 100px; transition: width .25s ease; }
.hud-row { display: flex; gap: 8px; flex-wrap: wrap; }
.hud-chip { background: var(--card); border: 1px solid var(--line); font-size: 12px; padding: 5px 10px; border-radius: 100px; color: var(--ink); }
.hud-chip.streak { background: var(--secondary-tint); color: var(--on-secondary-tint); border-color: transparent; font-weight: 600; }
.hud-chip.overall-score-chip { background: var(--primary-tint); color: var(--primary-dark); border-color: transparent; font-weight: 600; }
.overall-score-banner {
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
}
.overall-score-banner .osb-icon { font-size: 28px; line-height: 1; }
.overall-score-banner .osb-label { font-size: 12px; opacity: .85; }
.overall-score-banner .osb-value { font-size: 24px; font-weight: 700; }
.result-line.overall-add { color: var(--primary-dark); font-weight: 600; margin-top: 6px; }
.yt-subscribe {
  display: flex; align-items: center; gap: 12px;
  background: #FF0000; color: #fff; text-decoration: none;
  border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 14px;
}
.yt-subscribe .yt-icon {
  flex: 0 0 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.2); border-radius: 50%; font-size: 14px;
}
.yt-subscribe .yt-text { display: flex; flex-direction: column; text-align: left; }
.yt-subscribe .yt-title { font-size: 13.5px; font-weight: 700; }
.yt-subscribe .yt-sub { font-size: 11.5px; opacity: .85; }
.video-embed-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius-sm); overflow: hidden; background: #000; margin-bottom: 8px; }
.video-embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.video-watch-link { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #FF0000; font-weight: 600; text-decoration: none; margin: 0 0 18px; }

.quiz-question-card {
  background: var(--primary-tint); border-radius: var(--radius); padding: 20px 16px;
  text-align: center; margin-bottom: 16px;
}
.qq-sub { font-size: 12px; color: var(--primary-dark); opacity: .8; text-transform: capitalize; margin-bottom: 6px; }
.qq-word { font-size: 22px; font-weight: 700; color: var(--primary-dark); line-height: 1.35; }
.qq-word.hi { font-family: var(--font-hi); }
.spell-hi-row { margin-top: 4px; }
.qq-prompt { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

.options-grid { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  text-align: left; padding: 13px 15px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  background: var(--card); color: var(--ink); font-size: 14px; font-family: inherit;
  cursor: pointer;
}
.option-btn:active { transform: scale(.98); }
.option-btn.hi { font-family: var(--font-hi); font-size: 15px; }
.option-btn.correct { border-color: var(--success); background: var(--success-tint); color: var(--on-success-tint); font-weight: 600; }
.option-btn.wrong { border-color: var(--danger); background: var(--danger-tint); color: var(--on-danger-tint); }
.option-btn:disabled { cursor: default; }

/* ===== Speed Round ===== */
.speed-hud { margin-bottom: 14px; }
.speed-timer-track { height: 10px; background: var(--line); border-radius: 100px; overflow: hidden; margin-bottom: 10px; }
.speed-timer-fill { height: 100%; border-radius: 100px; transition: width 1s linear, background .3s ease; }
.speed-timer-track.urgent { animation: timerPulse .6s ease infinite; }
.speed-card { transition: transform .1s ease; }
.speed-card.pop-correct { animation: popCorrect .35s ease; }
.speed-card.shake-wrong { animation: shakeWrong .35s ease; }
@keyframes popCorrect {
  0% { transform: scale(1); }
  40% { transform: scale(1.045); background: var(--success-tint); }
  100% { transform: scale(1); }
}
@keyframes shakeWrong {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .55; }
}

.feedback { margin-top: 12px; text-align: center; font-size: 13.5px; font-weight: 600; padding: 10px; border-radius: var(--radius-sm); }
.feedback.good { background: var(--success-tint); color: var(--on-success-tint); }
.feedback.bad { background: var(--danger-tint); color: var(--on-danger-tint); }

/* ===== Spelling ===== */
.spell-answer { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
.spell-slot {
  width: 34px; height: 40px; border-bottom: 2.5px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--ink);
}
.spell-tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.letter-tile {
  width: 38px; height: 38px; border-radius: 10px; border: none;
  background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer;
}
.letter-tile.used { visibility: hidden; }
.spell-actions { display: flex; gap: 10px; justify-content: center; }
.spell-btn-sm { border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 12.5px; padding: 7px 14px; border-radius: 100px; cursor: pointer; }
.spell-btn-hint { border-color: #f5c451; background: #fff8e6; color: #9a6b00; font-weight: 600; }
.spell-btn-hint:disabled { opacity: .5; cursor: not-allowed; }
.letter-tile.hinted { background: #fff2c4; border-color: #f5c451; }
.spell-slot.hinted-slot { border-color: #f5c451; background: #fff8e6; color: #9a6b00; }

/* ===== Translate It: sentence building ===== */
.sb-listen-btn { margin-top: 14px; }
.hi-speak-btn { margin-top: 12px; }
.hi-speak-btn + .qq-prompt { margin-top: 10px; }
.sb-answer-row {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  min-height: 46px; align-items: flex-start;
  padding: 10px; margin-bottom: 14px;
  border: 1.5px dashed var(--line); border-radius: var(--radius-sm);
  transition: border-color .2s ease, background .2s ease;
}
.sb-answer-row.sb-correct { border-color: var(--success); border-style: solid; background: var(--success-tint); }
.sb-answer-row.sb-wrong { border-color: var(--danger); border-style: solid; background: var(--danger-tint); }
.sb-answer-placeholder { font-size: 12.5px; color: var(--muted); padding: 8px 4px; }
.sb-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
.sb-tile {
  border: none; border-radius: 100px; padding: 10px 16px;
  font-size: 14.5px; font-weight: 600; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line);
  cursor: pointer; font-family: inherit;
}
.sb-tile:active { transform: scale(.96); }
.sb-tile.c0 { background: var(--primary-tint); border-color: transparent; color: var(--primary-dark); transform: rotate(-1.5deg); }
.sb-tile.c1 { background: var(--secondary-tint); border-color: transparent; color: var(--on-secondary-tint); transform: rotate(1.5deg); }
.sb-tile.c2 { background: var(--success-tint); border-color: transparent; color: var(--on-success-tint); transform: rotate(-1deg); }
.sb-tile.c3 { background: var(--card); border-color: var(--line); color: var(--ink); transform: rotate(1deg); }
.sb-tile.placed { background: var(--primary); color: #fff; border-color: transparent; transform: none; }
.sb-tile:disabled { cursor: default; }
.sb-next-btn { display: block; margin: 12px auto 0; }

/* ===== Word match ===== */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: var(--radius-sm); padding: 12px 10px; font-size: 12.5px;
  cursor: pointer; text-align: center; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
}
.match-tile.selected { border-color: var(--primary); background: var(--primary-tint); }
.match-tile.matched { border-color: var(--success); background: var(--success-tint); color: var(--on-success-tint); opacity: .7; }
.match-tile:disabled { cursor: default; }
.match-tile.hi { justify-content: center; gap: 8px; }
.match-tile-label { flex: initial; min-width: 0; }

/* ===== Result screen ===== */
.result-card { text-align: center; padding: 30px 16px; }
.result-stars { font-size: 30px; letter-spacing: 4px; margin-bottom: 10px; }
.result-card h2 { font-size: 19px; margin-bottom: 6px; }
.result-pct { font-size: 40px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
.result-line { font-size: 13.5px; color: var(--ink); }
.result-line.muted { color: var(--muted); margin-top: 2px; margin-bottom: 22px; }
.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.primary-btn { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: var(--radius-sm); font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
.secondary-btn { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 14px; border-radius: var(--radius-sm); font-size: 14.5px; cursor: pointer; font-family: inherit; }

main {
  flex: 1;
  padding: 18px 18px calc(90px + var(--safe-bottom));
}

/* ===== Bottom tab nav ===== */
.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  background: var(--bg);
  border-top: 1px solid var(--line);
  display: flex;
  padding: 6px 4px calc(6px + var(--safe-bottom));
  z-index: 30;
}
.tabbar button {
  flex: 1;
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  border-radius: 10px;
}
.tabbar button .icon { font-size: 19px; line-height: 1; }
.tabbar button.active { color: var(--primary); }
.tabbar button.active .icon { transform: translateY(-1px); }

/* ===== Home ===== */
.hero {
  background: linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 22px 20px 20px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.hero .eyebrow-dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.16);
  padding: 5px 10px;
  border-radius: 100px;
  font-size: 12px;
  margin-bottom: 12px;
}
.hero .eyebrow-dot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--secondary); }
.hero h2 { font-size: 20px; color: #fff; margin-bottom: 4px; }
.hero p { margin: 6px 0 0; font-size: 13.5px; color: rgba(255,255,255,.85); max-width: 34ch; }

/* Compact banner used only on the home screen, so more stories fit above the fold */
.hero-home {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-home .hero-icon { font-size: 22px; flex-shrink: 0; }
.hero-home h2 { font-size: 14.5px; color: #fff; margin-bottom: 2px; }
.hero-home p { margin: 0; font-size: 11.5px; color: rgba(255,255,255,.82); }

/* Scroll cue: hints that there are more stories below, hides once scrolled or if nothing to scroll */
.scroll-cue {
  position: fixed;
  left: 50%;
  bottom: calc(74px + var(--safe-bottom));
  transform: translateX(-50%);
  background: var(--primary);
  color: #fff;
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
  z-index: 25;
  cursor: pointer;
  animation: scrollCueBounce 1.4s ease-in-out infinite;

.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-item {

}

.menu-item .chev { color: var(--muted); font-size: 17px; }

.lesson-card {

.mark-complete-btn {

  margin-top: 6px;
}

/* ===== Vocabulary ===== */
.vocab-card {
  border: 1px solid var(--line);

}

.vocab-card .reveal .example { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 4px; }
.vocab-card .tap-hint { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* ===== Practice ===== */
.pill-tabs { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 2px; }
.pill-tabs button {

  background: var(--bg);
  color: var(--muted);

}
.pill-tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }

.q-card {
  border: 1px solid var(--line);

  padding: 16px;
  margin-bottom: 14px;
}
.q-card .qnum { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.q-card .qtext { font-size: 14.5px; margin-bottom: 4px; }
.q-card .qtext.hi { font-size: 14.5px; color: var(--muted); margin-bottom: 10px; }
.q-card textarea {

  font-weight: 500;
  display: inline-block;
}

.blank-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }

  padding: 7px 10px;
  font-size: 14px;
  width: 130px;
  font-family: inherit;
  text-align: center;
}

.blank-card input.wrong { border-color: var(--danger); background: var(--danger-tint); color: var(--on-danger-tint); }
.word-bank {

  background: var(--card);

}

  border-radius: 100px;
  font-size: 12.5px;
  color: var(--ink);
}
.check-all-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--secondary);
  color: var(--on-secondary-tint);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  margin: 6px 0 4px;
}
.blanks-score { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }

.tr-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.tr-card .prompt { font-size: 15px; margin-bottom: 10px; }

/* ===== Speak It ===== */
.speak-card {

  border-radius: var(--radius);
  padding: 20px 18px;
  margin-bottom: 14px;
  text-align: center;
}
.speak-card .num { font-size: 11px; color: var(--secondary); font-weight: 600; margin-bottom: 10px; }
.speak-card .sentence { font-size: 18px; font-weight: 500; margin-bottom: 16px; line-height: 1.5; }
.tts-unavailable { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.speak-btn-row { display: flex; gap: 10px; justify-content: center; }
.speak-btn {
  border: none;
  border-radius: 100px;
  padding: 11px 20px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.speak-btn.play { background: var(--primary-tint); color: var(--primary); }
.speak-btn.done { background: var(--success-tint); color: var(--success); }
.speak-btn.play.is-playing {
  background: var(--primary); color: #fff;
  animation: speakPulse 0.9s ease-in-out infinite;
}
@keyframes speakPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,0,0,0.12); }
  50% { transform: scale(1.045); box-shadow: 0 0 0 6px rgba(0,0,0,0); }
}
/* Small icon-only speaker buttons: inline hints (Spelling) and tiles (Word Match) */
.inline-speak-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: var(--primary-tint); color: var(--primary);
  width: 20px; height: 20px; border-radius: 50%; font-size: 10.5px;
  cursor: pointer; vertical-align: middle; margin-left: 2px; padding: 0;
}
.inline-speak-btn.is-playing { background: var(--primary); color: #fff; animation: speakPulse 0.9s ease-in-out infinite; }
.tile-speak-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: var(--primary-tint); color: var(--primary);
  width: 22px; height: 22px; border-radius: 50%; font-size: 11px;
  cursor: pointer; padding: 0; flex-shrink: 0;
}
.tile-speak-btn.is-playing { background: var(--primary); color: #fff; animation: speakPulse 0.9s ease-in-out infinite; }
.speak-card.marked { border-color: var(--success); }

/* ===== Progress ===== */
.progress-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}
.progress-card h3 { font-size: 15px; margin-bottom: 12px; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.progress-row:last-child { margin-bottom: 0; }
.progress-row .label { flex: 0 0 118px; font-size: 12.5px; color: var(--muted); }
.progress-row .bar-track { flex: 1; height: 8px; background: var(--line); border-radius: 100px; overflow: hidden; }
.progress-row .bar-fill { height: 100%; background: var(--primary); border-radius: 100px; }
.progress-row .pct { flex: 0 0 34px; text-align: right; font-size: 12px; color: var(--muted); }
.overall-ring-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
.overall-pct { font-size: 30px; font-weight: 700; color: var(--primary); }
.overall-sub { font-size: 12.5px; color: var(--muted); }
.reset-link { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; text-decoration: underline; cursor: pointer; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state .icon { font-size: 34px; margin-bottom: 10px; }
.empty-state p { font-size: 13.5px; }

@media (max-width: 360px) {
  :root { --main-pad-x: 14px; }
  main { padding: 16px var(--main-pad-x) calc(90px + var(--safe-bottom)); }
}

        { "en": "As soon as dawn broke, the crow flew off, looking around carefully as he went.", "hi": "सुबह होते ही कौआ उड़ चला, और रास्ते में ध्यान से चारों ओर देखता रहा।" },
        { "en": "Further ahead, he spotted the tortoise and the rat making their way forward.", "hi": "आगे जाकर उसे कछुआ और चूहा रास्ते में आगे बढ़ते हुए दिखे।" },
        { "en": "The crow cawed to let them know he had seen them and was flying ahead to search for the deer.", "hi": "कौए ने काँव-काँव करके उन्हें बताया कि उसने उन्हें देख लिया है और वह आगे हिरण की तलाश में जा रहा है।" },
        { "en": "He began calling out, \"Deer, brother, where are you? Call out to me, my friend!\"", "hi": "वह पुकारने लगा, \"हिरण भाई, तुम कहाँ हो? मुझे आवाज़ दो, दोस्त!\"" },

        { "en": "Flying towards the sound, he found the deer struggling, trapped in a hunter's snare.", "hi": "आवाज़ की दिशा में उड़कर, उसे हिरण एक शिकारी के जाल में फँसा हुआ, छटपटाता मिला।" },
        { "en": "The deer said, weeping, that a cruel hunter had laid the trap, and he had not seen the net in time.", "hi": "रोते हुए हिरण ने बताया कि एक क्रूर शिकारी ने वह जाल बिछाया था, और उसे वह जाल समय रहते दिखाई नहीं दिया।" },
        { "en": "\"The hunter will surely come and take me away. Consider my story over, friend,\" the deer sobbed.", "hi": "\"शिकारी ज़रूर आएगा और मुझे ले जाएगा। दोस्त, मेरी कहानी यहीं खत्म समझो,\" हिरण ने सिसकते हुए कहा।" },
        { "en": "\"Give my last greetings to the rat and the tortoise as well.\"", "hi": "\"चूहे और कछुए को भी मेरी आख़िरी विदाई कह देना।\"" },
        { "en": "The crow said, \"Friend, we will save you, even if it costs us our lives.\"", "hi": "कौए ने कहा, \"दोस्त, हम तुम्हें बचाएँगे, चाहे इसके लिए हमें अपनी जान ही क्यों न देनी पड़े।\"" },
        { "en": "The deer asked, disappointed, \"But how will you manage that?\"", "hi": "निराश होकर हिरण ने पूछा, \"लेकिन तुम यह कैसे कर पाओगे?\"" },
        { "en": "The crow flapped his wings and said, \"I will carry my friend the rat on my back. He will gnaw through the net with his sharp teeth.\"", "hi": "कौए ने अपने पंख फड़फड़ाकर कहा, \"मैं अपने दोस्त चूहे को अपनी पीठ पर बिठाकर लाऊँगा। वह अपने तेज़ दाँतों से जाल कुतर देगा।\"" },
        { "en": "The deer's eyes lit up. \"Then go, friend, bring brother rat quickly!\"", "hi": "हिरण की आँखें चमक उठीं। \"तो जाओ दोस्त, जल्दी से चूहे भाई को ले आओ!\"" },
        { "en": "The crow flew quickly back to where the tortoise and the rat had reached.", "hi": "कौआ तेज़ी से उड़कर वहाँ पहुँचा जहाँ कछुआ और चूहा पहुँच चुके थे।" },
        { "en": "Without wasting a moment, he said, \"Friends, our deer is trapped in a wicked hunter's snare, and his life is in danger.\"", "hi": "बिना एक पल गँवाए उसने कहा, \"दोस्तों, हमारा हिरण एक दुष्ट शिकारी के जाल में फँसा है, और उसकी जान ख़तरे में है।\"" },
        { "en": "\"If we don't rescue him before the hunter arrives, he will be killed.\"", "hi": "\"अगर हमने शिकारी के आने से पहले उसे नहीं बचाया, तो वह मारा जाएगा।\"" },

        { "en": "\"I will lead him deep into the forest, while brother rat gnaws open the bag and frees the tortoise.\"", "hi": "\"मैं उसे जंगल के भीतर तक ले जाऊँगा, जबकि चूहा भाई थैला कुतरकर कछुए को आज़ाद कर देगा।\"" },

        { "en": "The deer led him deep into the forest, then dashed away and hid in the thick bushes.", "hi": "हिरण उसे जंगल के भीतर तक ले गया, फिर तेज़ी से भागकर घनी झाड़ियों में छिप गया।" },

<script>
/* ===========================================================
   Translation Story Hindi — App Logic
   Vanilla JS SPA. Content lives in data/stories.js (window.TSH_DATA).
   To add a new story: add an object to the "stories" array there —
   no changes needed in this file.
=========================================================== */

const STORIES = (window.TSH_DATA && window.TSH_DATA.stories) || [];
const PROGRESS_KEY = 'tsh_progress_v1';

/* ---------- Progress storage ---------- */
function loadAllProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveAllProgress(all) {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(all));
}
function getProg(storyId) {
  const all = loadAllProgress();
  return all[storyId] || {
    readLines: 0, storyMarkedDone: false,
    vocabSeen: [], comprehensionOpened: [],
    blanks: {}, translationOpened: { toHindi: [], toEnglish: [] },
    speakDone: []
  };
}
function updateProg(storyId, patchFn) {
  const all = loadAllProgress();
  const cur = all[storyId] || getProg(storyId);
  all[storyId] = patchFn(cur);
  saveAllProgress(all);
}
function resetAllProgress() {
  localStorage.removeItem(PROGRESS_KEY);
}

function computePercents(story) {
  const p = getProg(story.id);
  const totalLines = story.story.length || 1;
  const readFrac = p.storyMarkedDone ? 100 : Math.min(100, Math.round(((p.readLines || 0) / totalLines) * 100));
  const vocabPct = story.vocabulary.length ? Math.round(((p.vocabSeen || []).length / story.vocabulary.length) * 100) : 0;
  const compPct = story.comprehension.length ? Math.round(((p.comprehensionOpened || []).length / story.comprehension.length) * 100) : 0;
  const totalBlanks = story.fillBlanks.questions.length || 1;
  const blanksCorrect = Object.values(p.blanks || {}).filter(v => v && v.correct).length;
  const blanksPct = Math.round((blanksCorrect / totalBlanks) * 100);
  const totalTr = story.translation.toHindi.length + story.translation.toEnglish.length || 1;
  const trOpened = ((p.translationOpened && p.translationOpened.toHindi) || []).length + ((p.translationOpened && p.translationOpened.toEnglish) || []).length;
  const trPct = Math.round((trOpened / totalTr) * 100);
  const totalSpeak = story.speakIt.length || 1;
  const speakPct = Math.round(((p.speakDone || []).length / totalSpeak) * 100);
  const overall = Math.round(readFrac * 0.25 + vocabPct * 0.2 + compPct * 0.15 + blanksPct * 0.2 + trPct * 0.1 + speakPct * 0.1);
  return { readFrac, vocabPct, compPct, blanksPct, trPct, speakPct, overall };
}

/* ---------- Helpers ---------- */
function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Safely embeds a string as a single-quoted JS argument inside a
// double-quoted HTML onclick attribute (e.g. onclick="fn('${jsAttr(x)}')").
// Escapes backslashes and single quotes for the JS string first, THEN
// HTML-escapes &, <, >, " for the surrounding attribute — apostrophes are
// deliberately left as literal characters (not &#39;) since they're not
// the attribute delimiter here, and HTML-entity-encoding them would stop
// the earlier JS backslash-escape from ever taking effect.
function jsAttr(str) {
  return String(str == null ? '' : str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function getStory(id) { return STORIES.find(s => s.id === id); }
function nav(hash) { window.location.hash = hash; }
window.nav = nav;

/* ---------- Router ---------- */
function parseRoute() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if (parts[0] === 'story' && parts[1]) {
    return { view: 'story', storyId: decodeURIComponent(parts[1]), sub: parts[2] || 'hub', sub2: parts[3] || null };
  }
  if (parts[0] === 'progress') return { view: 'progress' };
  if (parts[0] === 'learn') {
    if (parts[1]) return { view: 'learnDay', day: decodeURIComponent(parts[1]) };
    return { view: 'learn' };
  }
  if (parts[0] === 'games') {
    if (parts[1]) return { view: 'gamePlay', gameId: decodeURIComponent(parts[1]) };
    return { view: 'games' };
  }
  return { view: 'home' };
}

function render() {
  clearInterval(window.__speedTimerHandle);
  const route = parseRoute();
  const app = document.getElementById('app');
  let topbarHtml = '';
  let mainHtml = '';
  let activeTab = 'home';

  if (route.view === 'home') {
    activeTab = 'home';
    topbarHtml = topbar(null, 'Translation Story Hindi', null);
    mainHtml = viewHome();
  } else if (route.view === 'progress') {
    activeTab = 'progress';
    topbarHtml = topbar(null, 'Your Progress', 'हर कहानी में आपकी प्रगति');
    mainHtml = viewProgress();
  } else if (route.view === 'learn') {
    activeTab = 'home';
    topbarHtml = topbar('#/', 'Learn English', 'Practical Spoken English Course');
    mainHtml = viewLearn();
  } else if (route.view === 'learnDay') {
    activeTab = 'home';
    topbarHtml = topbar('#/learn', 'Lesson', null);
    mainHtml = viewLearnDay(route.day);
  } else if (route.view === 'games') {
    activeTab = 'home';
    topbarHtml = topbar('#/', 'Games', 'Learn while you play');
    mainHtml = viewGames();
  } else if (route.view === 'gamePlay') {
    activeTab = 'home';
    topbarHtml = topbar('#/games', 'Game', null);
    mainHtml = viewGamePlay(route.gameId);
  } else if (route.view === 'story') {
    const story = getStory(route.storyId);
    if (!story) { nav('#/'); return; }
    activeTab = 'home';
    if (route.sub === 'hub') {
      topbarHtml = topbar('#/', story.title.en, story.title.hi);
      mainHtml = viewStoryHub(story);
    } else if (route.sub === 'read') {
      topbarHtml = topbar(`#/story/${story.id}/hub`, 'Read Along', 'कहानी');
      mainHtml = viewStoryRead(story);
    } else if (route.sub === 'vocab') {
      topbarHtml = topbar(`#/story/${story.id}/hub`, 'Vocabulary', 'शब्दावली');
      mainHtml = viewVocabulary(story);
    } else if (route.sub === 'practice') {
      const tab = route.sub2 || 'comprehension';
      topbarHtml = topbar(`#/story/${story.id}/hub`, 'Practice', 'अभ्यास');
      mainHtml = viewPractice(story, tab);
    } else if (route.sub === 'speak') {
      topbarHtml = topbar(`#/story/${story.id}/hub`, 'Speak It', 'बोलने का अभ्यास');
      mainHtml = viewSpeak(story);
    } else {
      nav(`#/story/${story.id}/hub`); return;
    }
  }

  app.innerHTML = topbarHtml + `<main>${mainHtml}</main>` + tabbar(activeTab);
  window.scrollTo(0, 0);
  afterRender(route);
}

function topbar(backHash, title, sub) {
  return `<div class="topbar">
    ${backHash ? `<button class="back-btn" onclick="nav('${backHash}')" aria-label="Back">&#8592;</button>` : ''}
    <div>

/* ---------- Sound Effects (synthesized, no audio files needed) ---------- */
const SOUND_KEY = 'tsh_sound_v1';
function isSoundOn() {
  const v = localStorage.getItem(SOUND_KEY);
  return v === null ? true : v === '1';
}
function setSoundOn(on) { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); }
function toggleSound() { setSoundOn(!isSoundOn()); renderSettingsSheet(); }
window.toggleSound = toggleSound;

let __audioCtx = null;
function getAudioCtx() {
  if (!isSoundOn()) return null;
  if (!__audioCtx) {
    try { __audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (__audioCtx.state === 'suspended') __audioCtx.resume();
  return __audioCtx;
}
// Simple tone: one oscillator with a fast attack / exponential decay envelope.
function playTone(freq, startOffset, duration, type, peakGain) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakGain != null ? peakGain : 0.18, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
// Bell/chime note: a fundamental plus a few detuned harmonics, so it rings
// instead of sounding like a flat beep.
function playChimeNote(freq, startOffset, duration, peakGain) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + startOffset;
  const partials = [
    { mult: 1.0, gain: 1.0 },
    { mult: 2.01, gain: 0.45 },
    { mult: 3.0, gain: 0.22 },
    { mult: 4.2, gain: 0.10 },
  ];
  const base = peakGain != null ? peakGain : 0.2;
  partials.forEach(p => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * p.mult, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(base * p.gain, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  });
}
// Short filtered-noise sweep, used for whoosh-style screen/game transitions.
let __noiseBuffer = null;
function getNoiseBuffer(ctx) {
  if (__noiseBuffer && __noiseBuffer.sampleRate === ctx.sampleRate) return __noiseBuffer;
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  __noiseBuffer = buffer;
  return buffer;
}
function playSwoosh(rising, duration, peakGain) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime;
  const dur = duration || 0.32;
  const src = ctx.createBufferSource();
  src.buffer = getNoiseBuffer(ctx);
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 1.1;
  const f0 = rising ? 350 : 2000;
  const f1 = rising ? 2000 : 300;
  filter.frequency.setValueAtTime(f0, t0);
  filter.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakGain != null ? peakGain : 0.2, t0 + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}
// A short run of chime notes, ascending (joyful) or descending (sad/disappointed).
function playArpeggio(freqs, gapSeconds, noteDuration, peakGain) {
  freqs.forEach((f, i) => playChimeNote(f, i * gapSeconds, noteDuration, peakGain));
}

function sfxTap() { playTone(640, 0, 0.06, 'sine', 0.1); }
function sfxClick() { playTone(880, 0, 0.045, 'square', 0.05); }                           // crisp, quiet UI click
function sfxRoundStart() { playArpeggio([440, 587.33], 0.06, 0.3, 0.13); }                 // short "ready-go" up-blip
function sfxCorrect() { playArpeggio([523.25, 659.25, 783.99], 0.07, 0.45, 0.17); }       // joyful C-E-G chime
function sfxWrong() {
  const ctx = getAudioCtx();
  if (ctx) {
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(340, t0);
    osc.frequency.exponentialRampToValueAtTime(170, t0 + 0.34);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.16, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.38);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.4);
  }
}                                                                                          // sad descending "womp"
function sfxHint() { playArpeggio([659.25, 987.77], 0.09, 0.4, 0.13); }                    // light twinkle
function sfxComplete() { playArpeggio([523.25, 659.25, 783.99, 1046.5], 0.1, 0.75, 0.18); } // big joyful fanfare
function sfxLose() { playArpeggio([392.0, 349.23, 293.66], 0.16, 0.55, 0.15); }             // sad descending run

function getAllVocab() {
  const pool = [];
  (STORIES || []).forEach(s => {
    (s.vocabulary || []).forEach(v => {
      if (v.word && v.meaningEn) pool.push({ word: v.word, type: v.type || '', meaningEn: v.meaningEn, meaningHi: v.meaningHi || '', example: v.example || '', storyTitle: s.title.en });
    });
  });
  BASIC_VOCAB.forEach(v => {
    pool.push({ word: v.word, type: v.type || '', meaningEn: v.meaningEn, meaningHi: v.meaningHi || '', example: v.example || '', storyTitle: 'Basic Vocabulary' });
  });
  [].concat(EXTRA_VOCAB_NOUNS, EXTRA_VOCAB_VERBS, EXTRA_VOCAB_ADJECTIVES, EXTRA_VOCAB_ADVERBS, EXTRA_VOCAB_PREPOSITIONS, EXTRA_VOCAB_CONJUNCTIONS).forEach(v => {
    pool.push({ word: v.word, type: v.type || '', meaningEn: v.meaningEn, meaningHi: v.meaningHi || '', example: v.example || '', storyTitle: 'Basic Vocabulary' });
  });
  return pool;
}
// Hindi -> English sentence pool for the "Translate It" sentence-building
// game, drawn from each story's translation-practice data.
function getAllTranslationSentences() {
  const pool = [];
  (STORIES || []).forEach(s => {
    const items = (s.translation && s.translation.toEnglish) || [];
    items.forEach((t, i) => {
      if (t.hi && t.enSample) pool.push({ hi: t.hi, en: t.enSample, storyTitle: s.title.en, audioFile: `${s.id}-translate-${i + 1}.mp3` });
    });
  });
  return pool;
}
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sampleArr(arr, n) { return shuffleArr(arr).slice(0, Math.min(n, arr.length)); }

/* ---------- AdMob rewarded ads: unlock bonus game modes ----------
   Game modes flagged `bonus: true` in GAME_TYPES are locked until the
   player watches a rewarded ad, then stay unlocked permanently on this
   device. This only works once the app is rebuilt natively with Capacitor
   and the @capacitor-community/admob plugin — see SETUP_GUIDE.md. In a
   plain WebView APK (or this chat's preview) the plugin is absent, so
   tapping a locked tile shows an explanatory message instead of failing
   silently. */
const BONUS_UNLOCKS_KEY = 'tsh_bonus_unlocks_v1';
function loadBonusUnlocks() {
  try { return JSON.parse(localStorage.getItem(BONUS_UNLOCKS_KEY)) || {}; }
  catch (e) { return {}; }
}
function isBonusUnlocked(id) { return !!loadBonusUnlocks()[id]; }
function unlockBonusPermanently(id) {
  const u = loadBonusUnlocks();
  u[id] = true;
  localStorage.setItem(BONUS_UNLOCKS_KEY, JSON.stringify(u));
}

const ADMOB_CONFIG = {
  // Google's official TEST rewarded ad unit ID — safe to use during
  // development, never generates invalid traffic or policy issues.
  // Replace with your real ad unit ID from the AdMob console (Part A of
  // SETUP_GUIDE.md), and set testMode to false, only when you're ready to
  // publish.
  rewardedAdUnitId: 'ca-app-pub-3940256099942544/5224354917',
  testMode: true,
};
let admobReady = false;
async function ensureAdMobReady() {
  const plugins = window.Capacitor && window.Capacitor.Plugins;
  const AdMobPlugin = plugins && plugins.AdMob;
  if (!AdMobPlugin) return null;
  if (admobReady) return AdMobPlugin;
  try {
    await AdMobPlugin.initialize({ initializeForTesting: ADMOB_CONFIG.testMode });
    const consentInfo = await AdMobPlugin.requestConsentInfo();
    if (consentInfo.isConsentFormAvailable && consentInfo.status === 'REQUIRED') {
      await AdMobPlugin.showConsentForm();
    }
    admobReady = true;
    return AdMobPlugin;
  } catch (err) {
    console.error('AdMob init failed', err);
    return null;
  }
}
// Shows a rewarded ad and, if the reward is earned, permanently unlocks
// bonusId on this device. onFail receives a reason: 'unavailable' (no
// native plugin — browser preview or old WebView APK), 'dismissed' (user
// closed the ad before earning the reward), or 'error' (ad failed to
// load/show).
async function showRewardedAdForBonus(bonusId, onUnlocked, onFail) {
  const AdMobPlugin = await ensureAdMobReady();
  if (!AdMobPlugin) { if (onFail) onFail('unavailable'); return; }
  let rewardEarned = false;
  let rewardHandle = null;
  try {
    rewardHandle = await AdMobPlugin.addListener('onRewardedVideoAdReward', () => { rewardEarned = true; });
    await AdMobPlugin.prepareRewardVideoAd({ adId: ADMOB_CONFIG.rewardedAdUnitId, isTesting: ADMOB_CONFIG.testMode });
    await AdMobPlugin.showRewardVideoAd();
  } catch (err) {
    console.error('Rewarded ad failed', err);
    if (rewardHandle) rewardHandle.remove();
    if (onFail) onFail('error');
    return;
  }
  if (rewardHandle) rewardHandle.remove();
  if (rewardEarned) {
    unlockBonusPermanently(bonusId);
    if (onUnlocked) onUnlocked();
  } else {
    if (onFail) onFail('dismissed');
  }
}
// Called from a locked game tile / locked-game screen. tileEl (optional)
// gets a loading state while the ad loads so the tap isn't repeatable.
function tapBonusUnlock(gameId, tileEl) {
  if (tileEl && tileEl.classList.contains('ad-loading')) return;
  if (tileEl) {
    tileEl.classList.add('ad-loading');
    const label = tileEl.querySelector('.gt-lock-label');
    if (label) label.textContent = 'Loading ad\u2026';
  }
  showRewardedAdForBonus(
    gameId,
    () => { nav('#/games/' + gameId); },
    (reason) => {
      if (tileEl) {
        tileEl.classList.remove('ad-loading');
        const label = tileEl.querySelector('.gt-lock-label');
        if (label) label.textContent = '\u{1F3AC} Watch ad to unlock';
      }
      if (reason === 'unavailable') {
        alert("Ads aren't available in this preview. Open the installed app to unlock this.");
      } else if (reason === 'error') {
        alert("Couldn't load the ad right now. Please check your connection and try again.");
      }
      // reason === 'dismissed': the player just closed the ad early, no message needed.
    }
  );
}
window.tapBonusUnlock = tapBonusUnlock;
