/* ----- Session engine shared by the three multiple-choice games ----- */
let GAME = null; // active session state, rebuilt each time a game screen opens

function initGameSession(gameId) {
  clearInterval(window.__speedTimerHandle);
  const gameType = GAME_TYPES.find(g => g.id === gameId);
  if (gameType && gameType.bonus && !isBonusUnlocked(gameId)) {
    const stage = document.getElementById('gameStage');
    if (stage) stage.innerHTML = `
      <div class="empty-state">
        <div class="icon">${gameType.icon}</div>
        <p>This mode is locked. Watch a short ad to unlock it.</p>
        <button class="primary-btn" onclick="tapBonusUnlock('${gameId}', this)">&#127916; Watch ad to unlock</button>
      </div>`;
    return;
  }
  sfxWhoosh(true);
  const pool = getAllVocab();
  if (gameId === 'meaning-quiz') return startMCQGame('meaning-quiz', pool);
  if (gameId === 'translate') return startSentenceBuild(getAllTranslationSentences());
  if (gameId === 'fill-blank') return startFillBlank(pool);
  if (gameId === 'spelling') return startSpelling(pool);
  if (gameId === 'word-match') return startWordMatch(pool);
  if (gameId === 'speed-en-hi') return startSpeedRound(pool, gameId, 'toHi');
  if (gameId === 'speed-hi-en') return startSpeedRound(pool, gameId, 'toEn');
}

function startMCQGame(kind, pool) {
  const items = sampleArr(pool, Math.min(8, pool.length));
  GAME = { kind, items, index: 0, score: 0, streak: 0, bestStreak: 0, answered: false };
  sfxRoundStart();
  renderMCQQuestion();
}
function startFillBlank(pool) {
  const withExamples = pool.filter(v => v.example && new RegExp('\\b' + v.word + '\\b', 'i').test(v.example));
  if (withExamples.length < 4) {
    document.getElementById('gameStage').innerHTML = `<div class="empty-state"><div class="icon">&#9999;&#65039;</div><p>Not enough example sentences yet. Add stories with example sentences to unlock this game.</p></div>`;
    return;
  }
  GAME = { kind: 'fill-blank', items: sampleArr(withExamples, Math.min(8, withExamples.length)), index: 0, score: 0, streak: 0, bestStreak: 0, answered: false };
  sfxRoundStart();
  renderMCQQuestion();
}

function buildOptions(kind, correctItem, pool) {
  let correctLabel, optionLabels, questionLabel, questionSub, promptText, direction;
  if (kind === 'meaning-quiz') {
    questionLabel = correctItem.word;
    questionSub = correctItem.type;
    promptText = 'What does this word mean?';
    correctLabel = correctItem.meaningEn;
    const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word && v.meaningEn !== correctLabel), 3).map(v => v.meaningEn);
    optionLabels = shuffleArr([correctLabel, ...distractors]);
  } else if (kind === 'translate') {
    direction = Math.random() < 0.5 ? 'toHi' : 'toEn';
    if (direction === 'toHi') {
      questionLabel = correctItem.word;
      questionSub = 'English';
      promptText = 'Choose the Hindi meaning';
      correctLabel = correctItem.meaningHi || correctItem.meaningEn;
      const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word && (v.meaningHi || v.meaningEn) !== correctLabel), 3).map(v => v.meaningHi || v.meaningEn);
      optionLabels = shuffleArr([correctLabel, ...distractors]);
    } else {
      questionLabel = correctItem.meaningHi || correctItem.meaningEn;
      questionSub = 'Hindi';
      promptText = 'Choose the English word';
      correctLabel = correctItem.word;
      const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word), 3).map(v => v.word);
      optionLabels = shuffleArr([correctLabel, ...distractors]);
    }
  } else if (kind === 'fill-blank') {
    const re = new RegExp('\\b' + correctItem.word + '\\b', 'i');
    questionLabel = correctItem.example.replace(re, '_____');
    questionSub = 'Complete the sentence';
    promptText = 'Which word fits the blank?';
    correctLabel = correctItem.word;
    const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word), 3).map(v => v.word);
    optionLabels = shuffleArr([correctLabel, ...distractors]);
  }
  return { questionLabel, questionSub, promptText, correctLabel, optionLabels };
}

function renderMCQQuestion() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME) return;
  const total = GAME.items.length;
  if (GAME.index >= total) return renderGameResult();
  const item = GAME.items[GAME.index];
  const built = buildOptions(GAME.kind, item, getAllVocab());
  GAME.current = built;
  GAME.answered = false;
  const pct = Math.round((GAME.index / total) * 100);
  const isHiQuestion = GAME.kind === 'translate' && built.questionSub === 'Hindi';
  stage.innerHTML = `
    <div class="game-hud">
      <div class="hud-progress-track"><div class="hud-progress-fill" style="width:${pct}%"></div></div>
      <div class="hud-row">
        <span class="hud-chip">Q${GAME.index + 1}/${total}</span>
        <span class="hud-chip">&#11088; ${GAME.score}</span>
        ${GAME.streak > 1 ? `<span class="hud-chip streak">&#128293; ${GAME.streak}</span>` : ''}
        ${overallScoreChipHtml()}
      </div>
    </div>
    <div class="quiz-question-card">
      <div class="qq-sub">${esc(built.questionSub || '')}</div>
      <div class="qq-word ${isHiQuestion ? 'hi' : ''}">${esc(built.questionLabel)}</div>
      <div class="qq-prompt">${esc(built.promptText)}</div>
    </div>
    <div class="options-grid" id="optionsGrid">
      ${built.optionLabels.map((opt, i) => `<button class="option-btn ${GAME.kind === 'translate' && built.questionSub !== 'Hindi' ? '' : ''}" onclick="submitMCQAnswer(${i})">${esc(opt)}</button>`).join('')}
    </div>
    <div id="feedbackBar"></div>
  `;
}
function submitMCQAnswer(i) {
  if (!GAME || GAME.answered) return;
  sfxClick();
  GAME.answered = true;
  const built = GAME.current;
  const chosen = built.optionLabels[i];
  const correct = chosen === built.correctLabel;
  const buttons = document.querySelectorAll('#optionsGrid .option-btn');
  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (built.optionLabels[idx] === built.correctLabel) btn.classList.add('correct');
    else if (idx === i) btn.classList.add('wrong');
  });
  if (correct) {
    sfxCorrect();
    GAME.streak++;
    GAME.bestStreak = Math.max(GAME.bestStreak, GAME.streak);
    GAME.score += 10 + Math.min(GAME.streak - 1, 5) * 2;
  } else {
    sfxWrong();
    GAME.streak = 0;
  }
  const fb = document.getElementById('feedbackBar');
  fb.innerHTML = `<div class="feedback ${correct ? 'good' : 'bad'}">${correct ? '&#9989; Correct!' : `&#10060; Not quite. Correct: ${esc(built.correctLabel)}`}</div>`;
  setTimeout(() => { GAME.index++; renderMCQQuestion(); }, 1100);
}
window.submitMCQAnswer = submitMCQAnswer;

/* ----- Translate It: sentence-building game -----
   A Hindi sentence is shown; the correct English translation's words are
   shuffled into floating cards below. The player taps cards in order to
   build the sentence. A Listen button plays the correct English
   pronunciation aloud via the same speechSynthesis used in "Speak It". */
function tokenizeSentence(s) { return s.trim().split(/\s+/).filter(Boolean); }

function startSentenceBuild(pool) {
  if (pool.length < 4) {
    document.getElementById('gameStage').innerHTML = `<div class="empty-state"><div class="icon">&#127760;</div><p>Not enough translation sentences yet. Add stories with translation practice to unlock this game.</p></div>`;
    return;
  }
  GAME = { kind: 'translate', items: sampleArr(pool, Math.min(8, pool.length)), index: 0, score: 0, streak: 0, bestStreak: 0, answered: false };
  sfxRoundStart();
  renderSentenceBuild();
}
function renderSentenceBuild() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME) return;
  const total = GAME.items.length;
  if (GAME.index >= total) return renderGameResult();
  const item = GAME.items[GAME.index];
  const tokens = tokenizeSentence(item.en);
  let scrambled = shuffleArr(tokens.map((w, i) => ({ w, id: i })));
  if (tokens.length > 1) {
    let tries = 0;
    while (scrambled.every((t, i) => t.id === i) && tries < 5) { scrambled = shuffleArr(scrambled); tries++; }
  }
  GAME.current = { tokens, item };
  GAME.answered = false;
  GAME.picked = [];
  GAME.bank = scrambled;
  const pct = Math.round((GAME.index / total) * 100);
  const ttsSupported = ttsAvailable();
  stage.innerHTML = `
    <div class="game-hud">
      <div class="hud-progress-track"><div class="hud-progress-fill" style="width:${pct}%"></div></div>
      <div class="hud-row">
        <span class="hud-chip">Q${GAME.index + 1}/${total}</span>
        <span class="hud-chip">&#11088; ${GAME.score}</span>
        ${GAME.streak > 1 ? `<span class="hud-chip streak">&#128293; ${GAME.streak}</span>` : ''}
        ${overallScoreChipHtml()}
      </div>
    </div>
    <div class="quiz-question-card">
      <div class="qq-sub">Hindi</div>
      <div class="qq-word hi">${esc(item.hi)}</div>
      <button class="speak-btn play hi-speak-btn" onclick="sfxClick(); speakHindiWord('${jsAttr(item.hi)}', this)">&#128266; सुनें (Hindi)</button>
      <div class="qq-prompt">Tap the English words in order to build the translation</div>
      ${ttsSupported
        ? `<button class="speak-btn play sb-listen-btn" onclick="sfxClick(); playSentence('${jsAttr(item.en)}', '${item.audioFile}', this)">&#128266; Listen to correct pronunciation</button>`
        : `<div class="tts-unavailable sb-listen-btn">&#128263; Audio needs an internet connection.</div>`}
    </div>
    <div class="sb-answer-row" id="sbAnswer"></div>
    <div class="sb-bank" id="sbBank"></div>
    <div class="spell-actions">
      <button class="spell-btn-sm" onclick="sfxClick(); sbUndo()">&#9003; Undo</button>
      <button class="spell-btn-sm" onclick="sfxClick(); sbClear()">Clear</button>
    </div>
    <div id="feedbackBar"></div>
  `;
  renderSentenceBuildState();
}
function renderSentenceBuildState() {
  const ansEl = document.getElementById('sbAnswer');
  const bankEl = document.getElementById('sbBank');
  if (!ansEl || !bankEl || !GAME) return;
  ansEl.innerHTML = GAME.picked.length
    ? GAME.picked.map((t, i) => `<button class="sb-tile placed" onclick="sbUnpick(${i})">${esc(t.w)}</button>`).join('')
    : `<div class="sb-answer-placeholder">Tap words below to build the sentence&hellip;</div>`;
  bankEl.innerHTML = GAME.bank.map((t, i) => `<button class="sb-tile c${i % 4}" onclick="sbPick(${i})">${esc(t.w)}</button>`).join('');
}
function sbPick(bankIdx) {
  if (!GAME || GAME.answered) return;
  const tile = GAME.bank[bankIdx];
  if (!tile) return;
  sfxTap();
  GAME.bank.splice(bankIdx, 1);
  GAME.picked.push(tile);
  renderSentenceBuildState();
  if (GAME.picked.length === GAME.current.tokens.length) checkSentenceBuild();
}
window.sbPick = sbPick;
function sbUnpick(pickedIdx) {
  if (!GAME || GAME.answered) return;
  const tile = GAME.picked[pickedIdx];
  if (!tile) return;
  sfxTap();
  GAME.picked.splice(pickedIdx, 1);
  GAME.bank.push(tile);
  renderSentenceBuildState();
}
window.sbUnpick = sbUnpick;
function sbUndo() {
  if (!GAME || GAME.answered || !GAME.picked.length) return;
  sbUnpick(GAME.picked.length - 1);
}
window.sbUndo = sbUndo;
function sbClear() {
  if (!GAME || GAME.answered || !GAME.picked.length) return;
  while (GAME.picked.length) GAME.bank.push(GAME.picked.pop());
  renderSentenceBuildState();
}
window.sbClear = sbClear;
function checkSentenceBuild() {
  if (!GAME) return;
  GAME.answered = true;
  const tokens = GAME.current.tokens;
  const picked = GAME.picked.map(t => t.w);
  const correct = picked.length === tokens.length && picked.every((w, i) => w === tokens[i]);
  document.querySelectorAll('#sbAnswer .sb-tile').forEach(btn => btn.disabled = true);
  const ansEl = document.getElementById('sbAnswer');
  if (correct) {
    sfxCorrect();
    GAME.streak++;
    GAME.bestStreak = Math.max(GAME.bestStreak, GAME.streak);
    GAME.score += 10 + Math.min(GAME.streak - 1, 5) * 2;
    if (ansEl) ansEl.classList.add('sb-correct');
  } else {
    sfxWrong();
    GAME.streak = 0;
    if (ansEl) ansEl.classList.add('sb-wrong');
  }
  const fb = document.getElementById('feedbackBar');
  if (correct) {
    fb.innerHTML = `<div class="feedback good">&#9989; Correct!</div>`;
    setTimeout(() => { GAME.index++; renderSentenceBuild(); }, 1100);
  } else {
    // Wrong answers wait for the player to tap Next, giving them time to
    // compare their attempt against the correct sentence before moving on.
    fb.innerHTML = `
      <div class="feedback bad">&#10060; Not quite. Correct: ${esc(tokens.join(' '))}</div>
      <button class="primary-btn sb-next-btn" onclick="sfxClick(); sbGoNext()">Next &#8594;</button>
    `;
  }
}
function sbGoNext() {
  if (!GAME) return;
  GAME.index++;
  renderSentenceBuild();
}
window.sbGoNext = sbGoNext;
window.checkSentenceBuild = checkSentenceBuild;

/* ----- Speed Round: timed, single-direction translate sprint ----- */
const SPEED_PRAISE = ['&#9989; Zippy!', '&#9989; Nice!', '&#9989; Boom!', '&#9989; Speedy!', '&#9989; Yes!', '&#9989; On fire!', '&#9989; Sharp!'];
const SPEED_OOPS = ['&#10060; Oops! Correct:', '&#10060; So close! Correct:', '&#10060; Whoops! Correct:', '&#10060; Not quite. Correct:'];
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function startSpeedRound(pool, gameId, direction) {
  const usable = pool.filter(v => v.word && (direction === 'toEn' || v.meaningHi));
  if (usable.length < 4) {
    document.getElementById('gameStage').innerHTML = `<div class="empty-state"><div class="icon">&#9889;</div><p>Not enough words yet for a speed round &mdash; add a bit more vocabulary first.</p></div>`;
    return;
  }
  GAME = {
    kind: gameId, direction, pool: usable,
    score: 0, streak: 0, bestStreak: 0,
    correct: 0, attempted: 0,
    timeLeft: 60, totalTime: 60,
    answered: false, ended: false
  };
  renderSpeedQuestion();
  sfxRoundStart();
  window.__speedTimerHandle = setInterval(() => {
    if (!GAME || GAME.ended) { clearInterval(window.__speedTimerHandle); return; }
    GAME.timeLeft--;
    updateSpeedTimerUI();
    if (GAME.timeLeft <= 0) {
      GAME.ended = true;
      clearInterval(window.__speedTimerHandle);
      renderGameResult();
    }
  }, 1000);
}
function updateSpeedTimerUI() {
  const bar = document.getElementById('speedTimerFill');
  const label = document.getElementById('speedTimerLabel');
  if (!bar || !GAME) return;
  const pct = Math.max(0, Math.round((GAME.timeLeft / GAME.totalTime) * 100));
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'var(--success)' : pct > 20 ? 'var(--secondary)' : 'var(--danger)';
  if (label) label.textContent = GAME.timeLeft + 's';
  if (GAME.timeLeft <= 10) bar.parentElement.classList.add('urgent'); 
}
function buildSpeedOptions(direction, correctItem, pool) {
  let questionLabel, questionSub, promptText, correctLabel, optionLabels;
  if (direction === 'toHi') {
    questionLabel = correctItem.word;
    questionSub = 'English';
    promptText = 'Tap the Hindi meaning';
    correctLabel = correctItem.meaningHi || correctItem.meaningEn;
    const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word && (v.meaningHi || v.meaningEn) !== correctLabel), 3).map(v => v.meaningHi || v.meaningEn);
    optionLabels = shuffleArr([correctLabel, ...distractors]);
  } else {
    questionLabel = correctItem.meaningHi || correctItem.meaningEn;
    questionSub = 'Hindi';
    promptText = 'Tap the English word';
    correctLabel = correctItem.word;
    const distractors = sampleArr(pool.filter(v => v.word !== correctItem.word), 3).map(v => v.word);
    optionLabels = shuffleArr([correctLabel, ...distractors]);
  }
  return { questionLabel, questionSub, promptText, correctLabel, optionLabels };
}
function renderSpeedQuestion() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME || GAME.ended) return;
  let item = pickRandom(GAME.pool);
  if (GAME.pool.length > 1) { while (item === GAME.lastItem) item = pickRandom(GAME.pool); }
  GAME.lastItem = item;
  const built = buildSpeedOptions(GAME.direction, item, GAME.pool);
  GAME.current = built;
  GAME.answered = false;
  const isHiQuestion = built.questionSub === 'Hindi';
  const optsAreHi = built.questionSub === 'English';
  const pct = Math.max(0, Math.round((GAME.timeLeft / GAME.totalTime) * 100));
  stage.innerHTML = `
    <div class="speed-hud">
      <div class="speed-timer-track ${GAME.timeLeft <= 10 ? 'urgent' : ''}"><div class="speed-timer-fill" id="speedTimerFill" style="width:${pct}%; background:${pct > 50 ? 'var(--success)' : pct > 20 ? 'var(--secondary)' : 'var(--danger)'}"></div></div>
      <div class="hud-row">
        <span class="hud-chip" id="speedTimerLabel">&#9201; ${GAME.timeLeft}s</span>
        <span class="hud-chip">&#11088; ${GAME.score}</span>
        ${GAME.streak > 1 ? `<span class="hud-chip streak">&#128293; ${GAME.streak}</span>` : ''}
        ${overallScoreChipHtml()}
      </div>
    </div>
    <div class="quiz-question-card speed-card" id="speedCard">
      <div class="qq-sub">${esc(built.questionSub)}</div>
      <div class="qq-word ${isHiQuestion ? 'hi' : ''}">${esc(built.questionLabel)}</div>
      ${isHiQuestion ? `<button class="speak-btn play hi-speak-btn" onclick="sfxClick(); speakHindiWord('${jsAttr(built.questionLabel)}', this)">&#128266; सुनें</button>` : ''}
      <div class="qq-prompt">${esc(built.promptText)}</div>
    </div>
    <div class="options-grid" id="optionsGrid">
      ${built.optionLabels.map((opt, i) => `<button class="option-btn ${optsAreHi ? 'hi' : ''}" onclick="submitSpeedAnswer(${i})">${esc(opt)}</button>`).join('')}
    </div>
    <div id="feedbackBar"></div>
  `;
}
function submitSpeedAnswer(i) {
  if (!GAME || GAME.answered || GAME.ended) return;
  sfxClick();
  GAME.answered = true;
  GAME.attempted++;
  const built = GAME.current;
  const chosen = built.optionLabels[i];
  const correct = chosen === built.correctLabel;
  const buttons = document.querySelectorAll('#optionsGrid .option-btn');
  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (built.optionLabels[idx] === built.correctLabel) btn.classList.add('correct');
    else if (idx === i) btn.classList.add('wrong');
  });
  const card = document.getElementById('speedCard');
  const fb = document.getElementById('feedbackBar');
  if (correct) {
    sfxCorrect();
    GAME.correct++;
    GAME.streak++;
    GAME.bestStreak = Math.max(GAME.bestStreak, GAME.streak);
    GAME.score += 10 + Math.min(GAME.streak - 1, 5) * 2;
    if (card) card.classList.add('pop-correct');
    fb.innerHTML = `<div class="feedback good">${pickRandom(SPEED_PRAISE)}</div>`;
  } else {
    sfxWrong();
    GAME.streak = 0;
    if (card) card.classList.add('shake-wrong');
    fb.innerHTML = `<div class="feedback bad">${pickRandom(SPEED_OOPS)} ${esc(built.correctLabel)}</div>`;
  }
  setTimeout(() => { if (!GAME.ended) renderSpeedQuestion(); }, correct ? 550 : 2000);
}
window.submitSpeedAnswer = submitSpeedAnswer;

/* ----- Spelling Scramble ----- */
function startSpelling(pool) {
  const words = pool.filter(v => /^[A-Za-z]+$/.test(v.word) && v.word.length >= 3 && v.word.length <= 10);
  if (!words.length) {
    document.getElementById('gameStage').innerHTML = `<div class="empty-state"><div class="icon">&#128290;</div><p>No suitable words yet for spelling.</p></div>`;
    return;
  }
  GAME = { kind: 'spelling', items: sampleArr(words, Math.min(8, words.length)), index: 0, score: 0, streak: 0, bestStreak: 0, lives: 3, answer: [], letters: [], hintsUsed: 0 };
  sfxRoundStart();
  renderSpellingRound();
}
function renderSpellingRound() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME) return;
  const total = GAME.items.length;
  if (GAME.index >= total || GAME.lives <= 0) return renderGameResult();
  const item = GAME.items[GAME.index];
  GAME.answer = [];
  GAME.roundHints = 0;
  GAME.hintPositions = [];
  let letters = item.word.toLowerCase().split('');
  let scrambled = shuffleArr(letters);
  while (scrambled.join('') === letters.join('') && letters.length > 1) scrambled = shuffleArr(letters);
  GAME.letters = scrambled.map((ch, i) => ({ ch, used: false, id: i }));
  const pct = Math.round((GAME.index / total) * 100);
  stage.innerHTML = `
    <div class="game-hud">
      <div class="hud-progress-track"><div class="hud-progress-fill" style="width:${pct}%"></div></div>
      <div class="hud-row" id="spellHud">
        <span class="hud-chip">Q${GAME.index + 1}/${total}</span>
        <span class="hud-chip">&#11088; ${GAME.score}</span>
        <span class="hud-chip">${'&#10084;&#65039;'.repeat(GAME.lives)}</span>
        ${overallScoreChipHtml()}
      </div>
    </div>
    <div class="quiz-question-card">
      ${item.type ? `<div class="qq-sub">${esc(item.type)}</div>` : ''}
      ${item.meaningHi ? `<div class="qq-word hi spell-hi-row">${esc(item.meaningHi)}</div><button class="speak-btn play hi-speak-btn" onclick="sfxClick(); speakHindiWord('${jsAttr(item.meaningHi)}', this)">&#128266; सुनें</button>` : ''}
      <div class="qq-prompt" style="margin-top:6px;">${esc(item.meaningEn)}</div>
    </div>
    <div class="spell-answer" id="spellAnswer"></div>
    <div class="spell-tiles" id="spellTiles"></div>
    <div class="spell-actions">
      <button class="spell-btn-sm" onclick="sfxClick(); spellUndo()">&#9003; Undo</button>
      <button class="spell-btn-sm" onclick="sfxClick(); spellClear()">Clear</button>
      <button class="spell-btn-sm spell-btn-hint" id="spellHintBtn" onclick="sfxClick(); spellHint()">&#128161; Hint</button>
    </div>
    <div id="feedbackBar"></div>
  `;
  renderSpellState();
}
function renderSpellState() {
  const ansEl = document.getElementById('spellAnswer');
  const tilesEl = document.getElementById('spellTiles');
  if (!ansEl || !tilesEl || !GAME) return;
  const item = GAME.items[GAME.index];
  const slots = item.word.length;
  ansEl.innerHTML = Array.from({ length: slots }).map((_, i) => `<div class="spell-slot ${GAME.hintPositions && GAME.hintPositions[i] ? 'hinted-slot' : ''}">${GAME.answer[i] ? GAME.answer[i].toUpperCase() : ''}</div>`).join('');
  tilesEl.innerHTML = GAME.letters.map(l => `<button class="letter-tile ${l.used ? 'used' : ''}" ${l.used ? 'disabled' : ''} onclick="spellTapLetter(${l.id})">${l.ch.toUpperCase()}</button>`).join('');
  const hintBtn = document.getElementById('spellHintBtn');
  if (hintBtn) {
    const noMoreHints = GAME.answer.length >= item.word.length;
    hintBtn.disabled = noMoreHints;
    hintBtn.innerHTML = `&#128161; Hint${GAME.roundHints ? ` (${GAME.roundHints})` : ''}`;
  }
}
function spellTapLetter(id) {
  if (!GAME) return;
  const item = GAME.items[GAME.index];
  const letter = GAME.letters.find(l => l.id === id && !l.used);
  if (!letter || GAME.answer.length >= item.word.length) return;
  sfxTap();
  letter.used = true;
  GAME.answer.push(letter.ch);
  renderSpellState();
  if (GAME.answer.length === item.word.length) spellCheck();
}
window.spellTapLetter = spellTapLetter;
function spellUndo() {
  if (!GAME || !GAME.answer.length) return;
  const last = GAME.answer.pop();
  const letter = [...GAME.letters].reverse().find(l => l.used && l.ch === last);
  if (letter) letter.used = false;
  if (GAME.hintPositions) GAME.hintPositions[GAME.answer.length] = false;
  renderSpellState();
}
window.spellUndo = spellUndo;
function spellClear() {
  if (!GAME) return;
  GAME.answer = [];
  GAME.letters.forEach(l => l.used = false);
  GAME.hintPositions = [];
  renderSpellState();
}
window.spellClear = spellClear;
function spellHint() {
  if (!GAME) return;
  const item = GAME.items[GAME.index];
  const slotIndex = GAME.answer.length;
  if (slotIndex >= item.word.length) return;
  const neededCh = item.word.toLowerCase()[slotIndex];
  const tile = GAME.letters.find(l => !l.used && l.ch === neededCh);
  if (!tile) return;
  sfxHint();
  tile.used = true;
  GAME.answer.push(tile.ch);
  GAME.hintPositions[slotIndex] = true;
  GAME.roundHints = (GAME.roundHints || 0) + 1;
  GAME.hintsUsed = (GAME.hintsUsed || 0) + 1;
  GAME.score = Math.max(0, GAME.score - 2);
  refreshSpellHud();
  renderSpellState();
  if (GAME.answer.length === item.word.length) spellCheck();
}
window.spellHint = spellHint;
function refreshSpellHud() {
  const hud = document.getElementById('spellHud');
  if (!hud || !GAME) return;
  const total = GAME.items.length;
  hud.innerHTML = `
    <span class="hud-chip">Q${GAME.index + 1}/${total}</span>
    <span class="hud-chip">&#11088; ${GAME.score}</span>
    <span class="hud-chip">${'&#10084;&#65039;'.repeat(GAME.lives)}</span>
    ${overallScoreChipHtml()}
  `;
}
function spellCheck() {
  const item = GAME.items[GAME.index];
  const correct = GAME.answer.join('') === item.word.toLowerCase();
  const fb = document.getElementById('feedbackBar');
  if (correct) {
    sfxCorrect();
    GAME.streak++;
    GAME.bestStreak = Math.max(GAME.bestStreak, GAME.streak);
    GAME.score += 10 + Math.min(GAME.streak - 1, 5) * 2;
    refreshSpellHud();
    fb.innerHTML = `<div class="feedback good">&#9989; Correct! &mdash; ${esc(item.word)}</div>`;
    setTimeout(() => { GAME.index++; renderSpellingRound(); }, 1000);
  } else {
    GAME.streak = 0;
    GAME.lives--;
    if (GAME.lives <= 0) sfxLose(); else sfxWrong();
    refreshSpellHud();
    fb.innerHTML = `<div class="feedback bad">&#10060; Try again${GAME.lives <= 0 ? ` &mdash; it was ${esc(item.word)}` : ''}</div>`;
    setTimeout(() => {
      if (GAME.lives <= 0) { GAME.index++; renderSpellingRound(); }
      else { spellClear(); document.getElementById('feedbackBar').innerHTML = ''; }
    }, 900);
  }
}

/* ----- Word Match ----- */
function startWordMatch(pool) {
  const pairs = sampleArr(pool, Math.min(6, pool.length));
  if (pairs.length < 4) {
    document.getElementById('gameStage').innerHTML = `<div class="empty-state"><div class="icon">&#129513;</div><p>Add a few more vocabulary words to unlock Word Match.</p></div>`;
    return;
  }
  const left = pairs.map((p, i) => ({ id: 'L' + i, pairId: i, label: p.word, matched: false }));
  const right = shuffleArr(pairs.map((p, i) => ({ id: 'R' + i, pairId: i, label: p.meaningHi || p.meaningEn, matched: false })));
  GAME = { kind: 'word-match', pairs, left: shuffleArr(left), right, selectedLeft: null, selectedRight: null, matchedCount: 0, moves: 0, wrongMoves: 0, startTime: Date.now() };
  sfxRoundStart();
  renderWordMatch();
}
function renderWordMatch() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME) return;
  const total = GAME.pairs.length;
  stage.innerHTML = `
    <div class="game-hud">
      <div class="hud-row">
        <span class="hud-chip">Matched ${GAME.matchedCount}/${total}</span>
        <span class="hud-chip">Moves ${GAME.moves}</span>
        ${overallScoreChipHtml()}
      </div>
    </div>
    <div class="qq-prompt" style="text-align:center;margin:4px 0 14px;">Tap an English word, then its Hindi meaning</div>
    <div class="match-grid">
      <div class="match-col">${GAME.left.map(l => matchTileHtml(l, 'L')).join('')}</div>
      <div class="match-col">${GAME.right.map(r => matchTileHtml(r, 'R')).join('')}</div>
    </div>
  `;
}
function matchTileHtml(t, side) {
  const selected = (side === 'L' ? GAME.selectedLeft : GAME.selectedRight) === t.pairId && !t.matched;
  if (side === 'R') {
    // Hindi tiles get a small speaker icon alongside the tap target for
    // matching. A nested <button> inside the outer clickable element, with
    // stopPropagation, so tapping the speaker never counts as a match tap.
    return `<div class="match-tile hi ${t.matched ? 'matched' : ''} ${selected ? 'selected' : ''}" ${t.matched ? '' : `onclick="matchTap('R', ${t.pairId})"`}>
      <span class="match-tile-label">${esc(t.label)}</span>
      ${t.matched ? '' : `<button class="tile-speak-btn" onclick="event.stopPropagation(); sfxClick(); speakHindiWord('${jsAttr(t.label)}', this)" aria-label="Listen to Hindi">&#128266;</button>`}
    </div>`;
  }
  return `<button class="match-tile ${t.matched ? 'matched' : ''} ${selected ? 'selected' : ''}" ${t.matched ? 'disabled' : ''} onclick="matchTap('${side}', ${t.pairId})">${esc(t.label)}</button>`;
}
function matchTap(side, pairId) {
  if (!GAME) return;
  const list = side === 'L' ? GAME.left : GAME.right;
  const tile = list.find(t => t.pairId === pairId);
  if (!tile || tile.matched) return;
  if (side === 'L') GAME.selectedLeft = pairId; else GAME.selectedRight = pairId;
  sfxTap();
  renderWordMatch();
  if (GAME.selectedLeft != null && GAME.selectedRight != null) {
    GAME.moves++;
    if (GAME.selectedLeft === GAME.selectedRight) {
      sfxCorrect();
      GAME.left.find(t => t.pairId === GAME.selectedLeft).matched = true;
      GAME.right.find(t => t.pairId === GAME.selectedRight).matched = true;
      GAME.matchedCount++;
      GAME.selectedLeft = null; GAME.selectedRight = null;
      renderWordMatch();
      if (GAME.matchedCount === GAME.pairs.length) {
        const secs = Math.round((Date.now() - GAME.startTime) / 1000);
        GAME.elapsedSecs = secs;
        setTimeout(() => renderGameResult(), 400);
      }
    } else {
      sfxWrong();
      GAME.wrongMoves++;
      setTimeout(() => { GAME.selectedLeft = null; GAME.selectedRight = null; renderWordMatch(); }, 500);
    }
  }
}
window.matchTap = matchTap;

/* ----- Result screen ----- */
function renderGameResult() {
  const stage = document.getElementById('gameStage');
  if (!stage || !GAME) return;
  let pct, scoreLine, extraLine;
  if (GAME.kind === 'word-match') {
    const accuracy = GAME.moves ? Math.round((GAME.pairs.length / GAME.moves) * 100) : 100;
    pct = Math.min(100, accuracy);
    scoreLine = `${GAME.pairs.length} pairs matched in ${GAME.moves} moves`;
    extraLine = `Time: ${GAME.elapsedSecs || 0}s`;
  } else if (GAME.kind === 'spelling') {
    const total = GAME.items.length;
    const correctCount = GAME.index; // index advanced once per item regardless, approximate via score
    pct = Math.round((GAME.score / (total * 10)) * 100);
    pct = Math.max(0, Math.min(100, pct));
    scoreLine = `Score: ${GAME.score}`;
    extraLine = `Best streak: ${GAME.bestStreak}`;
  } else if (GAME.kind === 'speed-en-hi' || GAME.kind === 'speed-hi-en') {
    pct = GAME.attempted ? Math.round((GAME.correct / GAME.attempted) * 100) : 0;
    scoreLine = `${GAME.correct} correct out of ${GAME.attempted} in ${GAME.totalTime} seconds`;
    extraLine = `Best streak: ${GAME.bestStreak} \u00b7 Score: ${GAME.score}`;
  } else {
    const total = GAME.items.length;
    pct = Math.round((GAME.score / (total * 10)) * 100);
    pct = Math.max(0, Math.min(100, pct));
    scoreLine = `Score: ${GAME.score} / ${total * 10}`;
    extraLine = `Best streak: ${GAME.bestStreak}`;
  }
  const stars = pct >= 85 ? 3 : pct >= 60 ? 2 : pct >= 30 ? 1 : 0;
  const isSpeed = GAME.kind === 'speed-en-hi' || GAME.kind === 'speed-hi-en';
  const speedTitle = GAME.correct >= 15 ? '&#129504; Word Wizard!' : GAME.correct >= 10 ? '&#128640; Lightning Fast!' : GAME.correct >= 6 ? '&#127939; Quick Thinker!' : GAME.correct >= 3 ? '&#128694; Getting There!' : '&#128034; Warming Up!';
  saveGameBest(GAME.kind, pct);
  let sessionPoints = 0;
  if (!GAME._scored) {
    GAME._scored = true;
    if (GAME.kind === 'word-match') {
      sessionPoints = Math.max(0, GAME.pairs.length * 10 - GAME.wrongMoves * 3);
    } else {
      sessionPoints = GAME.score || 0;
    }
  }
  const newOverall = addOverallScore(sessionPoints);
  sfxComplete();
  stage.innerHTML = `
    <div class="result-card">
      <div class="result-stars">${'&#11088;'.repeat(stars)}${'&#9734;'.repeat(3 - stars)}</div>
      <h2>${isSpeed ? speedTitle : (pct >= 85 ? 'Excellent!' : pct >= 60 ? 'Well done!' : pct >= 30 ? 'Good try!' : 'Keep practicing!')}</h2>
      <div class="result-pct">${isSpeed ? GAME.correct : pct + '%'}</div>
      ${isSpeed ? `<div class="result-line muted" style="margin-top:-8px;">words correct</div>` : ''}
      <div class="result-line">${esc(scoreLine)}</div>
      <div class="result-line muted">${esc(extraLine)}</div>
      <div class="result-line overall-add">&#127942; +${sessionPoints} to Overall Score &middot; Total: ${newOverall}</div>
      ${ytSubscribeHtml('New Hindi-English lessons every week')}
      <div class="result-actions">
        <button class="primary-btn" onclick="sfxClick(); initGameSession('${GAME.kind}')">Play Again</button>
        <button class="secondary-btn" onclick="sfxClick(); sfxWhoosh(false); nav('#/games')">Back to Games</button>
      </div>
    </div>
  `;
}

window.markStoryDone = markStoryDone;

function trackReadScroll(story) {
  const totalLines = story.story.length;
  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const scrollable = document.body.scrollHeight - window.innerHeight;
      const frac = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 1;
      const lines = Math.round(frac * totalLines);
      const p = getProg(story.id);
      if (lines > (p.readLines || 0) && !p.storyMarkedDone) {
        updateProg(story.id, cur => ({ ...cur, readLines: lines }));
        const fill = document.getElementById('readProgressFill');
        if (fill) fill.style.width = Math.round((lines / totalLines) * 100) + '%';
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.__tshScrollHandler = onScroll;
}

/* ---------- Practice ---------- */
function viewPractice(story, tab) {

function practiceComprehension(story) {
  const p = getProg(story.id);
  const opened = new Set(p.comprehensionOpened || []);
  const items = story.comprehension.map((q, i) => `
    <div class="q-card">
      <div class="qnum">Question ${i + 1}</div>
      <div class="qtext">${esc(q.en)}</div>
      <div class="qtext hi">${esc(q.hi)}</div>
      <textarea placeholder="Write your answer here..." data-store="comp-${story.id}-${i}"></textarea>

function toggleSample(el, storyId, key, idx) {
  const card = el.closest('.q-card') || el.closest('.tr-card');
  const sampleBox = card.querySelector('.sample-answer');
  const nowShow = !sampleBox.classList.contains('show');
  sampleBox.classList.toggle('show', nowShow);
  el.textContent = (nowShow ? 'Hide' : 'Show') + ' sample answer';
  if (nowShow) {
    updateProg(storyId, cur => {
      if (key === 'comprehensionOpened') {
        const arr = new Set(cur.comprehensionOpened || []);
        arr.add(idx);
        return { ...cur, comprehensionOpened: Array.from(arr) };
      } else {
        const dir = key; // 'toHindi' or 'toEnglish'
        const to = cur.translationOpened || { toHindi: [], toEnglish: [] };
        const arr = new Set(to[dir] || []);
        arr.add(idx);
        return { ...cur, translationOpened: { ...to, [dir]: Array.from(arr) } };
      }
    });
  }
}
window.toggleSample = toggleSample;

function practiceBlanks(story) {
  const p = getProg(story.id);
  const bankHtml = story.fillBlanks.wordBank.map(w => `<span class="chip">${esc(w)}</span>`).join('');
  const qs = story.fillBlanks.questions.map((q, i) => {
    const parts = q.sentence.split('______');
    const saved = (p.blanks || {})[i];
    const cls = saved ? (saved.correct ? 'correct' : 'wrong') : '';
    const val = saved ? esc(saved.value || '') : '';
    return `<div class="blank-card">
      <div class="sentence">${esc(parts[0])}<input type="text" id="blank-${i}" class="${cls}" value="${val}" autocomplete="off" autocapitalize="off">${esc(parts[1] || '')}</div>
    </div>`;
  }).join('');
  const totalCorrect = Object.values(p.blanks || {}).filter(v => v && v.correct).length;
  return `
    <p style="font-size:13px;color:var(--muted);margin-bottom:4px;">Complete each sentence with a word from the box.</p>
    <div class="word-bank">${bankHtml}</div>
    ${qs}
    <button class="check-all-btn" onclick="checkBlanks('${story.id}')">Check my answers</button>
    <div class="blanks-score" id="blanksScore">${totalCorrect > 0 ? `You've got ${totalCorrect} of ${story.fillBlanks.questions.length} correct so far.` : ''}</div>
  `;
}
function checkBlanks(storyId) {
  const story = getStory(storyId);
  let correctCount = 0;
  const results = {};
  story.fillBlanks.questions.forEach((q, i) => {
    const input = document.getElementById(`blank-${i}`);
    const val = (input.value || '').trim().toLowerCase();
    const isCorrect = val === q.answer.toLowerCase();
    input.classList.remove('correct', 'wrong');
    input.classList.add(isCorrect ? 'correct' : 'wrong');
    if (isCorrect) correctCount++;
    results[i] = { value: input.value, correct: isCorrect };
  });
  updateProg(storyId, cur => ({ ...cur, blanks: results }));
  document.getElementById('blanksScore').textContent = `You've got ${correctCount} of ${story.fillBlanks.questions.length} correct.`;
}
window.checkBlanks = checkBlanks;

function practiceTranslation(story) {
  const p = getProg(story.id);
  const openedHi = new Set((p.translationOpened && p.translationOpened.toHindi) || []);
  const openedEn = new Set((p.translationOpened && p.translationOpened.toEnglish) || []);
  const toHindi = story.translation.toHindi.map((t, i) => `
    <div class="tr-card">
      <div class="qnum">Sentence ${i + 1}</div>
      <div class="prompt">${esc(t.en)}</div>
      <textarea placeholder="इसे हिंदी में लिखें..."></textarea>
      <span class="answer-toggle" onclick="toggleSample(this,'${story.id}','toHindi',${i})">${openedHi.has(i) ? 'Hide' : 'Show'} sample translation</span>
      <div class="sample-answer hi ${openedHi.has(i) ? 'show' : ''}">${esc(t.hiSample)}</div>
    </div>
  `).join('');
  const toEnglish = story.translation.toEnglish.map((t, i) => `
    <div class="tr-card">
      <div class="qnum">Sentence ${i + 1}</div>
      <div class="prompt hi">${esc(t.hi)}</div>
      <textarea placeholder="Write it in English..."></textarea>
      <span class="answer-toggle" onclick="toggleSample(this,'${story.id}','toEnglish',${i})">${openedEn.has(i) ? 'Hide' : 'Show'} sample translation</span>
      <div class="sample-answer ${openedEn.has(i) ? 'show' : ''}">${esc(t.enSample)}</div>
    </div>
  `).join('');
  return `
    <div class="section-label">A. Translate into Hindi</div>
    ${toHindi}
    <div class="section-label">B. Translate into English</div>
    ${toEnglish}
  `;
}

/* ---------- Speak It ---------- */
function viewSpeak(story) {
  const p = getProg(story.id);
  const done = new Set(p.speakDone || []);
  const ttsSupported = ttsAvailable();
  const cards = story.speakIt.map((s, i) => `
    <div class="speak-card ${done.has(i) ? 'marked' : ''}" id="speak-${i}">
      <div class="num">SENTENCE ${i + 1}</div>
      <div class="sentence">${esc(s)}</div>
      ${!ttsSupported ? `<div class="tts-unavailable">&#128263; Audio needs an internet connection — read it aloud yourself 3 times for now.</div>` : ''}
      <div class="speak-btn-row">
        ${ttsSupported ? `<button class="speak-btn play" onclick="playSentence('${jsAttr(s)}', '${story.id}-speak-${i + 1}.mp3', this)">&#128266; Play</button>` : ''}
        <button class="speak-btn ${done.has(i) ? 'done' : ''}" onclick="markSpeakDone('${story.id}',${i})">${done.has(i) ? '\u2713 Practiced' : 'Mark as practiced'}</button>
      </div>
    </div>
  `).join('');
  return `<p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Read each sentence aloud 3 times, then try without looking.${ttsSupported ? ' Tap Play to hear it.' : ''}</p>${cards}`;
}
// Pre-recorded local audio covers every Speak It and Translate-game
// sentence, so playback there is instant and fully offline. ttsAvailable()
// only matters for the (now rare) case where a matching local file is
// somehow missing — always true since a fallback chain always applies.
function ttsAvailable() {
  return true;
}
// ----- Playback lock: only one audio/TTS plays at a time, and the button
// that triggered it visibly shows a "playing" state until it finishes. -----
let audioBusy = false;
let activeAudioBtn = null;
let audioSafetyTimer = null;

function setAudioButtonPlaying(btn, playing) {
  if (!btn) return;
  if (playing) btn.classList.add('is-playing');
  else btn.classList.remove('is-playing');
}
function releaseAudioLock() {
  audioBusy = false;
  if (audioSafetyTimer) { clearTimeout(audioSafetyTimer); audioSafetyTimer = null; }
  setAudioButtonPlaying(activeAudioBtn, false);
  activeAudioBtn = null;
}
// Claims the single-audio-at-a-time lock and marks btnEl as "playing".
// Returns false (and does nothing) if something else is already playing.
function acquireAudioLock(btnEl) {
  if (audioBusy) return false;
  audioBusy = true;
  activeAudioBtn = btnEl || null;
  setAudioButtonPlaying(activeAudioBtn, true);
  // Safety net: if no completion event ever fires for some reason, don't
  // leave the button stuck in "playing" state forever.
  audioSafetyTimer = setTimeout(releaseAudioLock, 15000);
  return true;
}
function playViaOnlineTTS(text, voice) {
  const url = 'https://api.streamelements.com/kappa/v2/speech?voice=' + encodeURIComponent(voice) + '&text=' + encodeURIComponent(text);
  const audio = new Audio(url);
  let handled = false;
  const fail = () => {
    if (handled) return;
    handled = true;
    releaseAudioLock();
    alert("Couldn't play audio. Please check your internet connection and try again.");
  };
  audio.addEventListener('ended', () => { if (!handled) { handled = true; releaseAudioLock(); } });
  audio.addEventListener('error', fail);
  audio.addEventListener('stalled', fail);
  const playPromise = audio.play();
  if (playPromise && playPromise.catch) playPromise.catch(fail);
}
// Shared TTS fallback chain (used whenever there's no pre-recorded local
// file, or one failed to load): native Capacitor TTS (if this app is ever
// rebuilt with it — works fully offline), then the browser's Web Speech
// API, then an online audio stream as a last resort. lang is a BCP-47 tag
// ('en-IN' or 'hi-IN'); onlineVoice picks the matching StreamElements
// voice ('Brian' for English, 'Aditi' — an Amazon Polly bilingual
// Hindi/Indian-English voice — for Hindi).
function speakViaTTS(text, lang, onlineVoice) {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) {
    window.Capacitor.Plugins.TextToSpeech.speak({ text: text, lang: lang, rate: 0.9, category: 'ambient' })
      .catch(err => console.error('Native TTS error', err))
      .then(releaseAudioLock, releaseAudioLock);
    return;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    u.onend = releaseAudioLock;
    u.onerror = releaseAudioLock;
    window.speechSynthesis.speak(u);
    return;
  }
  playViaOnlineTTS(text, onlineVoice);
}
// Main entry point for ENGLISH sentences (Speak It, Translate game).
// audioFile (e.g. "empty-pot-speak-1.mp3") is the pre-recorded clip
// bundled under audio/ for this exact sentence — instant and works fully
// offline. Falls back to speakViaTTS only if that file is missing or
// fails to load. btnEl (passed as `this` from the inline onclick) gets a
// "playing" visual state, and taps are ignored while anything is playing.
function playSentence(text, audioFile, btnEl) {
  if (!acquireAudioLock(btnEl)) return; // one sound at a time — ignore taps while busy
  if (audioFile) {
    const audio = new Audio('audio/' + audioFile);
    let usedLocal = false;
    audio.addEventListener('ended', () => { if (usedLocal) releaseAudioLock(); });
    audio.addEventListener('error', () => {
      if (!usedLocal) speakViaTTS(text, 'en-IN', 'Brian');
      else releaseAudioLock();
    });
    const p = audio.play();
    if (p && p.then) {
      p.then(() => { usedLocal = true; }).catch(() => { if (!usedLocal) speakViaTTS(text, 'en-IN', 'Brian'); });
    } else {
      usedLocal = true;
    }
    return;
  }
  speakViaTTS(text, 'en-IN', 'Brian');
}
window.playSentence = playSentence;
// Entry point for HINDI words/sentences in the games (Meaning Match, Word
// Match, Fill in the Blank, Spelling, Translate It's prompt, both Speed
// Rounds). Pure TTS — no pre-recorded files, since this covers the full
// 700+ word vocabulary pool rather than a fixed set of sentences.
function speakHindiWord(text, btnEl) {
  if (!acquireAudioLock(btnEl)) return;
  speakViaTTS(text, 'hi-IN', 'Aditi');
}
window.speakHindiWord = speakHindiWord;
function markSpeakDone(storyId, idx) {
  updateProg(storyId, cur => {
    const set = new Set(cur.speakDone || []);
    if (set.has(idx)) set.delete(idx); else set.add(idx);
    return { ...cur, speakDone: Array.from(set) };
  });
  render();
}
window.markSpeakDone = markSpeakDone;

/* ---------- Progress page ---------- */
function viewProgress() {
  if (!STORIES.length) return `<div class="empty-state"><div class="icon">&#128202;</div><p>No stories yet.</p></div>`;
  const cards = STORIES.map(story => {
    const pc = computePercents(story);
    const rows = [
      ['Story reading', pc.readFrac],
      ['Vocabulary', pc.vocabPct],
      ['Comprehension', pc.compPct],
      ['Fill in the blanks', pc.blanksPct],
      ['Translation', pc.trPct],
      ['Speak It', pc.speakPct],
    ].map(([label, pct]) => `
      <div class="progress-row">
        <div class="label">${label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
      </div>
    `).join('');
    return `<div class="progress-card">
      <div class="overall-ring-wrap">
        <div class="overall-pct">${pc.overall}%</div>
        <div>
          <h3 style="margin-bottom:2px;">${esc(story.title.en)}</h3>
          <div class="overall-sub">Overall progress</div>
        </div>
      </div>
      <div style="height:14px;"></div>
      ${rows}
    </div>`;
  }).join('');
  return `${cards}<div class="reset-link" onclick="confirmReset()">Reset all progress</div>`;
}
function confirmReset() {
  if (confirm('This will erase your reading and practice progress for all stories on this device. Continue?')) {
    resetAllProgress();
    render();
  }
}
window.confirmReset = confirmReset;

/* ---------- Post-render hooks ---------- */
function afterRender(route) {
  if (window.__tshScrollHandler) {
    window.removeEventListener('scroll', window.__tshScrollHandler);
    window.__tshScrollHandler = null;
  }
  if (route.view === 'story' && route.sub === 'read') {
    trackReadScroll(getStory(route.storyId));
  } else if (route.view === 'home') {
    trackHomeScrollCue();
  } else if (route.view === 'gamePlay') {
    initGameSession(route.gameId);
  }
}

function trackHomeScrollCue() {
  const cue = document.getElementById('homeScrollCue');
  if (!cue) return;
  function update() {
    const scrollable = document.body.scrollHeight - window.innerHeight;
    if (scrollable < 40 || window.scrollY > 24) {
      cue.classList.add('hide');
    } else {
      cue.classList.remove('hide');
    }
  }
  update();
  window.addEventListener('scroll', update, { passive: true });
  window.__tshScrollHandler = update;
}

/* ---------- Theme (dark mode + colour accent) ---------- */
const THEME_KEY = 'tsh_theme_v1';
const ACCENTS = [
  { id: 'default', label: 'Light Blue', cls: 'c-default' },
  { id: 'yellow', label: 'Light Yellow', cls: 'c-yellow' },
  { id: 'orange', label: 'Light Orange', cls: 'c-orange' },
  { id: 'green', label: 'Light Green', cls: 'c-green' },
];
function loadTheme() {
  try {
    const t = JSON.parse(localStorage.getItem(THEME_KEY));
    if (t && t.mode && t.accent) return t;
  } catch (e) {}
  return { mode: 'light', accent: 'default' };
}
function saveTheme(t) { localStorage.setItem(THEME_KEY, JSON.stringify(t)); }
function applyTheme(t) {
  document.documentElement.setAttribute('data-mode', t.mode);
  document.documentElement.setAttribute('data-accent', t.accent);
  requestAnimationFrame(() => {
    const primary = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && primary) meta.setAttribute('content', primary);
  });
}
function toggleDarkMode() {
  const t = loadTheme();
  t.mode = t.mode === 'dark' ? 'light' : 'dark';
  saveTheme(t);
  applyTheme(t);
  renderSettingsSheet();
}
window.toggleDarkMode = toggleDarkMode;
function setAccent(accent) {
  const t = loadTheme();
  t.accent = accent;
  saveTheme(t);
  applyTheme(t);
  renderSettingsSheet();
}
window.setAccent = setAccent;

/* ---------- Settings sheet ---------- */
function settingsSheetHtml() {
  const t = loadTheme();
  const swatches = ACCENTS.map(a => `<button class="swatch ${a.cls} ${t.accent === a.id ? 'active' : ''}" onclick="setAccent('${a.id}')" aria-label="${a.label}" title="${a.label}">${t.accent === a.id ? '&#10003;' : ''}</button>`).join('');
  return `
    <div class="settings-backdrop" onclick="closeSettingsSheet()"></div>
    <div class="settings-sheet">
      <div class="head">
        <h3>Settings</h3>
        <button class="close-x" onclick="closeSettingsSheet()" aria-label="Close">&#10005;</button>
      </div>
      <div class="settings-row">
        <div class="label">Dark Mode<div class="d">Easier on the eyes at night</div></div>
        <button class="toggle-switch ${t.mode === 'dark' ? 'on' : ''}" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="knob"></span></button>
      </div>
      <div class="settings-row">
        <div class="label">Sound Effects<div class="d">Tones for taps, correct/wrong answers &amp; wins</div></div>
        <button class="toggle-switch ${isSoundOn() ? 'on' : ''}" onclick="toggleSound()" aria-label="Toggle sound effects"><span class="knob"></span></button>
      </div>
      <div class="settings-row" style="display:block;">
        <div class="label">Colour Theme</div>
        <div class="swatch-row">${swatches}</div>
      </div>
    </div>
  `;
}
function openSettingsSheet() {
  closeSettingsSheet();
  const el = document.createElement('div');
  el.id = 'tshSettingsRoot';
  el.innerHTML = settingsSheetHtml();
  document.body.appendChild(el);
}
window.openSettingsSheet = openSettingsSheet;
function closeSettingsSheet() {
  const el = document.getElementById('tshSettingsRoot');
  if (el) el.remove();
}
window.closeSettingsSheet = closeSettingsSheet;
function renderSettingsSheet() {
  const el = document.getElementById('tshSettingsRoot');
  if (el) el.innerHTML = settingsSheetHtml();
}

/* ---------- Init ---------- */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  applyTheme(loadTheme());
  if (!window.location.hash) window.location.hash = '#/';
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});

</script>
</body>
